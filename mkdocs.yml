site_name: 智能体大赛引导文档
nav:
  - 文档说明: index.md
  - 平台介绍: platform.md
  - SDK总览: sdk_structure/sdk.md
  - 播放器总览: player/player.md
  - 热身赛:
    - SDK文档: sdk_structure/test_race_sdk.md
    - 开发引导: instruction/test_race.md
  - Rollman: 
    - 游戏简介: document/pacman.md
    - 通信文档: document/pacman_api.md
    - SDK文档: sdk_structure/pacman_sdk.md
    - 播放器使用说明: player/pacman.md
    - 开发引导: instruction/pacman.md
    - 讲座资料:
      - 视频链接: lecture/pacman.md
      - 算法入门: lecture/algorithms.pdf
  - 游戏开发文档:
    - 前端:
      - 通信: game_dev/frontend/communication/communication.md
    - 后端: game_dev/backend/index.md
theme:
  logo: imgs/icon.jpg
  favicon: imgs/icon.jpg
  palette:
    primary: black
  name: material

markdown_extensions: 
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.pathconverter:
      base_path: 'agent_guide' # default: ''
      relative_path: '' # default ''
      absolute: true # default: false
      tags: 'a script img link object embed'

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - javascripts/katex.js
  - https://unpkg.com/browse/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/browse/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/browse/katex@0.16.11/dist/katex.min.css

plugins:
  - search
  - glightbox
  - git-revision-date-localized:
      fallback_to_build_date: true
      locale: zh
  - git-authors:
      show_contribution: true
      show_line_count: true